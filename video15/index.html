<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Matching Game - Step by Step</title>
    <link rel="stylesheet" href="../common/css/style.css">
    <script src="../common/js/game.js" defer></script>
</head>
<body>

    <div id="mode_selection" style="text-align: center; margin-top: 100px;">
        <h1>오픈립스<br>영어 문장 맞추기 게임</h1>
        <p>원하시는 학습 모드를 선택해 주세요.</p>
        <div style="display: flex; gap: 20px; justify-content: center; margin-top: 30px;">
            <button class="btn_mode" onclick="startGame(20)" style="padding: 20px; cursor: pointer; font-size: 18px;">20문장 랜덤 모드</button>
            <button class="btn_mode" onclick="startGame(0)" style="padding: 20px; cursor: pointer; font-size: 18px;">전체 문장 모드</button>
        </div>
    </div>

    <div id="game_area" style="display: none;">
        <div class="info_bar">
            <span>Page: <span id="current_page">1</span> / <span id="total_pages">?</span></span>
            <span>틀린 횟수: <span id="miss_count" style="color: #fa5252;">0</span></span>
        </div>

        <div class="game_container">
            <div class="column" id="kr_col"></div>
            <div class="column" id="en_col"></div>
        </div>
    </div>

    <div id="result_overlay" style="display: none;">
        <h1>🎉 Game Clear!</h1>
        <p style="font-size: 20px;">총 틀린 횟수: <span id="total_miss">0</span>번</p>
        <button class="btn_restart" onclick="location.reload()">다시 시작하기</button>
    </div>

    <script>
        // 모드 선택 후 실제 게임을 시작하는 함수
        function startGame(limit) {
            // UI 전환
            document.getElementById('mode_selection').style.display = 'none';
            document.getElementById('game_area').style.display = 'block';

            // JS 파일에 있는 initGame 함수 호출 (경로와 제한 개수 전달)
            // defer를 사용했으므로 game.js 로드 완료 후 실행됩니다.
            if (typeof initGame === "function") {
                initGame('./data.json', limit);
            }
        }
    </script>
</body>
</html>
