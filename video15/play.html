<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:type" content="website">
<meta property="og:url" content="https://openlips.github.io/english-matching-game/">
<meta property="og:title" content="오픈립스 영어 문장 맞추기 게임">
<meta property="og:description" content="유튜브 영상으로 배운 문장을 게임으로 복습해보세요! 20문장 랜덤 모드 지원.">
<meta property="og:image" content="./common/images/og_image.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="오픈립스 영어 문장 맞추기 게임">
<meta name="twitter:description" content="게임으로 즐겁게 배우는 영어 문장! 지금 바로 도전해보세요.">
<meta name="twitter:image" content="./common/images/og_image.png">
<title>오픈립스 - Playing</title>
<link rel="stylesheet" href="../common/css/style.css">
<script src="../common/js/game.js" defer></script>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-672HBRNVB6"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-672HBRNVB6');
</script>
</head>
<body>
    <div id="game_area">
        <div class="info_bar">
            <span>PAGE <span><span id="current_page">1</span> / <span id="total_pages">?</span></span></span>
            <span>틀린 횟수 <span id="miss_count" style="color: #fa5252;">0</span></span>
        </div>
        <div class="game_container">
            <div class="column" id="kr_col"></div>
            <div class="column" id="en_col"></div>
        </div>
        <a href="index.html" class="bt_back">뒤로가기</a>
    </div>

    <div id="result_overlay" style="display: none;">
        <h1>🎉 Game Clear!</h1>
        <p style="font-size: 20px;">총 틀린 횟수: <span id="total_miss">0</span>번</p>
        <button class="btn_restart" onclick="location.reload()">다시 시작하기</button>
    </div>
    <div class="copyright_gap"></div>
    <div class="copyright">Copyright 2026. Open Lips All rights reserved.</div>

    <script>
window.onload = () => {
    // 1. URL에서 limit 파라미터 값을 가져옴
    const urlParams = new URLSearchParams(window.location.search);
    const limit = parseInt(urlParams.get('limit')) || 0;

    // 2. [추가] 구글 애널리틱스에 클릭 이벤트 전송
    // 어떤 모드로 게임을 시작했는지 데이터를 보냅니다.
    if (typeof gtag === 'function') {
        gtag('event', 'game_start_mode', {
            'mode_name': limit === 20 ? '20문장 랜덤' : '전체 문장',
            'video_id': 'video15' // 나중에 video16 등을 만들 때 이 부분만 바꿔주면 구분하기 쉽습니다.
        });
    }

    // 3. game.js의 initGame 실행
    if (typeof initGame === "function") {
        initGame('./data.json', limit);
    }
};
    </script>
</body>
</html>
