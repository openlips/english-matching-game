<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta property="og:type" content="website">
<meta property="og:url" content="https://openlips.github.io/english-matching-game/">
<meta property="og:title" content="오픈립스 영어 문장 맞추기 게임">
<meta property="og:description" content="유튜브 영상으로 배운 문장을 게임으로 복습해보세요! 20문장 랜덤 모드 지원.">
<meta property="og:image" content="./common/images/og_image.png">

<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="오픈립스 영어 문장 맞추기 게임">
<meta name="twitter:description" content="게임으로 즐겁게 배우는 영어 문장! 지금 바로 도전해보세요.">
<meta name="twitter:image" content="./common/images/og_image.png">
<title>오픈립스 - English Matching Game</title>
<link rel="stylesheet" href="./common/css/style.css">
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-672HBRNVB6"></script>
<script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-672HBRNVB6');
</script>
</head>
<body>

    <div class="main">
        <h1><span>🎮 오픈립스</span> 영어 문장 맞추기 게임</h1>
        <p>유튜브 영상별 학습 게임 리스트입니다.</p>

        <div class="game_list" id="portal_list"></div>
    </div>

    <script>
        // 앞으로 영상이 늘어나면 이 배열에 정보만 추가하면 됩니다.
        const games = [
            { id: 15, title: "기초 생활 영어 50문장", path: "./video15/index.html" },
            // { id: 16, title: "여행 영어 필수 표현", path: "./video16/" },
        ];

        const listContainer = document.getElementById('portal_list');

        games.forEach(game => {
            const card = document.createElement('a');
            card.href = game.path;
            card.className = 'game_card';
            card.innerHTML = `
                <span class="video_num">Video #${game.id}</span>
                <span class="game_title">${game.title}</span>
            `;
            listContainer.appendChild(card);
        });
    </script>
</body>
</html>
